name: Sync UmaTL Upstream

on:
  schedule:
    # Run twice weekly every Monday and Thursday at 04:00 UTC
    - cron: '0 4 * * 1,4'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force re-download and overlay of all files'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install blake3

      - name: Run upstream sync & overlay
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            EXTRA_ARGS="--force"
          fi
          python sync_umatl.py $EXTRA_ARGS

      - name: Check for changes
        id: git_status
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.git_status.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: sync and overlay latest UmaTL upstream translations"
          git push
